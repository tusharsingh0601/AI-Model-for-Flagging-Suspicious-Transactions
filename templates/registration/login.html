{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FraudGuard AI</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'transactions/css/webpage.css' %}">
</head>

<body class="auth-body">

    <canvas id="neural-canvas"></canvas>

    <a href="{% url 'home' %}" class="back-home"><i class="fa-solid fa-arrow-left"></i> Home</a>

    <div class="auth-card">
        <div class="auth-header">
            <i class="fa-solid fa-fingerprint"></i>
            <h2>Welcome Back</h2>
            <p>Access your secure dashboard.</p>
        </div>

        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
            <div
                style="background: rgba(255, 42, 109, 0.1); border: 1px solid #ff2a6d; color: #ff2a6d; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-size: 0.9rem;">
                <i class="fa-solid fa-circle-exclamation"></i> Invalid username or password.
            </div>
            {% endif %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" placeholder="Username" required
                    style="width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; border-radius: 8px; outline: none;">
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" placeholder="••••••••" required
                    style="width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; border-radius: 8px; outline: none;">
            </div>

            <button type="submit" class="btn btn-primary btn-full"
                style="width: 100%; padding: 12px; background: #00f2ff; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-family: 'Orbitron', sans-serif;">Sign
                In</button>
        </form>
        <div class="auth-footer">
            <p>Don't have an account? <a href="{% url 'signup' %}">Get Started</a></p>
        </div>
    </div>

    <script src="{% static 'transactions/js/auth.js' %}"></script>
</body>

</html>
